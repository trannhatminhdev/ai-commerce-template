name: ai-commerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-commerce-postgres
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ai_commerce}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ai_commerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-commerce-net

  redis:
    image: redis:7-alpine
    container_name: ai-commerce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai-commerce-net

  backend:
    container_name: ai-commerce-be
    build:
      context: ..
      dockerfile: docker/be/Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ai_commerce}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-commerce-net

  frontend:
    container_name: ai-commerce-fe
    build:
      context: ..
      dockerfile: docker/fe/Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: http://localhost:${BE_PORT:-3000}/api/v1
    ports:
      - "${FE_PORT:-3001}:3000"
    depends_on:
      - backend
    networks:
      - ai-commerce-net

networks:
  ai-commerce-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
