name: ai-commerce

services:
  database:
    image: mysql:8.0
    container_name: ai-commerce-db
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ai_commerce}
      MYSQL_USER: ${DB_USER:-ai_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ai_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-commerce-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ai-commerce-phpmyadmin
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ai-commerce-net

  redis:
    image: redis:7-alpine
    container_name: ai-commerce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ai-commerce-net

networks:
  ai-commerce-net:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
